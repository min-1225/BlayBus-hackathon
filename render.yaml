# Render Blueprint — 백엔드(Spring Boot) 배포.
# 대시보드에서 "New > Blueprint" 로 이 저장소를 연결하면 이 파일을 읽어 서비스를 만든다.
# 비밀값(sync: false)은 Render 대시보드에서 직접 입력한다(코드/깃에 남기지 않음).
services:
  - type: web
    name: kiobridge-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/schedules?destination=ping
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
